# PR-Agent configuration. The AUTHORITATIVE copy lives on the
# pr-agent-config branch (maintainer-controlled); this tree copy is for
# humans. Keep the two in sync.
#
# Standards: skill://new-repo-scaffold §2b/§6 — the config branch is pinned in
# .github/workflows/pr-agent.yml and must NEVER be ${{ github.head_ref }}.

[openai]
api_base = "https://opencode.ai/zen/go/v1"

[config]
model = "openai/deepseek-v4-flash"
ai_timeout = 1800 # reviews on large diffs take minutes; the upstream default is too low
custom_model_max_tokens = 128000
max_model_tokens = 128000
fallback_models = []
verbosity_level = 3
repo_context_from_default_branch = true # standards docs read from main (maintainer-controlled), never the PR head
repo_context_files = [
    "docs/coding-standards.md",
    "docs/testing-standards.md",
    "docs/writing-documentation.md",
    "docs/dag-library.md",
]

[pr_reviewer]
require_tests_review = true
require_security_review = true
require_estimate_effort_to_review = true
num_max_findings = 10
extra_instructions = "In addition to your standard review, check the PR against each file in repo_context_files. Add a 'Compliance' section per doc: 'Coding Standards', 'Testing Standards', 'Documentation Standards', 'DAG Library'. For each, list any violations found, or state 'No violations' if the PR complies."

[github_action_config]
handle_push_trigger = true
push_commands = ["/review", "/improve"]
