# PR-Agent configuration — the authoritative copy. The review bot reads
# this file from main; PR branches can never influence it.
#
# Standards: skill://new-repo-scaffold §2b/§6 — the bot's config ref is
# pinned in .github/workflows/pr-agent.yml and must NEVER be ${{ github.head_ref }}.

[openai]
# The canonical LLM endpoint (skill://cloudflare-ai-gateway): Cloudflare
# AI Gateway, dynamic route fallback2 (OpenCode primary → DeepSeek
# fallback). The previous opencode.ai/zen/go/v1 workspace hit its $1/mo
# spending cap (401 MonthlyLimitError) and every review silently failed.
api_base = "https://gateway.ai.cloudflare.com/v1/e21a5be58ac1e8f7d5619539feb2dc3d/default/compat"

[config]
model = "openai/dynamic/fallback2"
ai_timeout = 1800 # reviews on large diffs take minutes; the upstream default is too low
custom_model_max_tokens = 128000
max_model_tokens = 128000
# The route's models reason by default, and reasoning tokens come OUT of the
# completion budget. On the 2026-10-06 review of fix/pelias-settlement-layers
# the model spent 10,386 of its 11,121 output tokens reasoning and returned no
# parseable mapping — a 200 OK, so nothing looked like an error (gateway log,
# log id 01M48M4E7SY1XST1H7E27SXGTX): the run hard-fails with "model response
# did not contain a non-empty review mapping". Measured on this route the same
# day: 752/814 output tokens were reasoning without the switch, 0/109 with it.
# The app answers the same wall the same way (houses/settings.py:65 sends
# reasoning={"enabled": false} for town descriptions); this is that switch for
# the bot. `additional_reasoning_effort_models` is what makes the parameter
# reach the wire, measured as an A/B on 2026-10-06 (same config otherwise,
# PR-Agent's own log line, litellm_ai_handler.py:2550): with ["dynamic/fallback2"]
# present it logs "Adding reasoning_effort with value none to model
# openai/dynamic/fallback2" and the review call's gateway row shows reasoning
# tokens 0; with the list empty the line does not appear and the parameter is
# never sent. The entry is needed because litellm has no metadata for a
# Cloudflare dynamic route, so PR-Agent's `_litellm_supports_reasoning` probe
# fails for this id (only the entry list — matched by exact id or path suffix —
# or litellm's own metadata can open that branch).
# Tradeoff, accepted: reviews reason less, so an opinion is thinner than a
# reasoner's — but a thin review beats a run that fails.
reasoning_effort = "none"
additional_reasoning_effort_models = ["dynamic/fallback2"]
# Retries: the gateway's are off by design (skill://cloudflare-ai-gateway) and
# this chain is the client's — `retry_with_fallback_models` tries one model per
# entry and never repeats a model (pr_processing.py at the pinned SHA), so an
# empty list means the run has exactly one attempt. It stays empty because a
# second member has to be a model that actually answers, and none of the
# obvious candidates can be named from here (measured 2026-10-06, all against
# this gateway): `dynamic/fallback2` is 200, but the model it resolves to
# (`deepseek/deepseek-v4-flash`) returns 402 Insufficient Balance when
# addressed directly, and `z-ai/glm-4.6v` returns 400 Model not found — the
# route's provider keys and funding do not carry over to the model id. The
# routes API returns an empty result for this token, so a second route name
# cannot be read from here either.
# Known gap, unchanged by this file: a transient 429/5xx on the single route
# still fails the review run. Fill this list only with an id verified to answer
# (a one-token call through the gateway is enough to prove it).
fallback_models = []
# Sampling temperature — raised from the 0.2 default to 0.8 (2026-10-02).
# The /improve (suggestions) run looped in thought for 25 minutes at 0.2:
# 124,972 of 131,072 completion tokens were repetition, finish_reason=length,
# content=null, and pr-agent posted "Failed to generate code suggestions".
# Looping is the known low-temperature failure mode of reasoning models
# (arXiv:2512.12895 — looping falls sharply by T≈0.8; DeepSeek/HF cards
# recommend high T for reasoners). omp runs this same model family at T=0
# without looping only because its generations are short and tool-chunked —
# pr-agent's single long generation needs the exploration. Temperature is a
# stopgap, not a fix: if loops persist at 0.8, move only the suggestions tool
# to a non-reasoning model instead of raising further.
temperature = 0.8

verbosity_level = 3
repo_context_from_default_branch = true # standards docs read from main (maintainer-controlled), never the PR head
repo_context_files = [
    "AGENTS.md",
    "docs/coding-standards.md",
    "docs/testing-standards.md",
    "docs/writing-documentation.md",
    "docs/dag-library.md",
    "docs/ux-standards.md",
]

[litellm]
# cf-aig-* headers — the same values the local metadata proxy injects
# (skill://cloudflare-ai-gateway): Cloudflare-side retries disabled, the
# client (PR-Agent's retry_with_fallback_models) owns retries.
extra_headers = '{"cf-aig-request-timeout": "1800000", "cf-aig-max-attempts": "0", "cf-aig-backoff": "exponential"}'

[pr_code_suggestions]
# DISABLED (2026-10-02). The suggestions tool is off: the auto run no longer
# invokes /improve (see push_commands below). Reasons, in order:
#   * the pinned version's suggestions generator always uses the global
#     [config] model chain (per-tool 'model' is NOT read — verified in the
#     pinned source), so it cannot be pointed at a format-reliable model;
#   * the reasoning model on that chain loops at low temperature and, once
#     temperature fixes the loop, emits its own YAML shape instead of the
#     parser's contract — hard-failing the whole review run;
#   * upstream's own design treats suggestions as advisory
#     (qodo-ai/pr-agent#2729 / #2730: unparseable output should degrade to
#     "no suggestions", not crash), and our gate only needs the review.
# The tool may still be run deliberately with a `/improve` comment; this
# section stays so that path has a sane contract, but nothing auto-runs it.

[pr_reviewer]
# Key review findings post INLINE as GitHub review threads (resolvable).
# main's branch protection has required_conversation_resolution — the PR
# cannot merge until every bot thread is resolved. Requires the pinned
# pr-agent >= d265b4250d (GitHub inline verification); older pins silently
# keep findings in the summary. The suggestions table (/improve) has no
# inline mode in any pr-agent version — it stays a summary comment.
inline_key_issues = true
require_tests_review = true
require_security_review = true
require_estimate_effort_to_review = true
num_max_findings = 10
extra_instructions = "In addition to your standard review, check the PR against each file in repo_context_files. Add a 'Compliance' section per doc: 'Coding Standards', 'Testing Standards', 'Documentation Standards', 'DAG Library', 'Docs Navigation (AGENTS.md)'. For each, list any violations found, or state 'No violations' if the PR complies. For Docs Navigation: any doc added, renamed, or removed must be reachable from AGENTS.md's decision tree and must update its cross-references (link, never copy; one topic per file)."

[github_action_config]
handle_push_trigger = true
# The auto run reviews only — suggestions are disabled (see the
# [pr_code_suggestions] block). /improve remains available as a deliberate
# comment-triggered command.
push_commands = ["/review"]
# default is that every PR gets reviewed.
skip_commands = ["/skip"]
