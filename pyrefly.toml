# Pyrefly type-checker config — the engine behind `make typecheck` /
# `make check` (via scripts/pyrefly-lock.py, which enforces the baseline
# lock in BOTH directions).
#
# Standalone pyrefly.toml: keys are TOP-LEVEL (no [pyrefly] wrapper —
# that header belongs in pyproject.toml's [tool.pyrefly]).
#
# Strictness: `default` preset + two extra default-off rules enabled:
#   - missing-override-decorator — enforces @override on every DAG node
#     compute/attempt/... override (structural typing makes this a real
#     correctness guard; the lock prevents NEW overrides without it)
#   - missing-super-call — __init__ must call super().__init__()
# The 554-error baseline (`.pyrefly-baseline.json`) is the committed
# contract — regenerate with: scripts/pyrefly-lock.py update-baseline
preset = "default"

[errors]
missing-override-decorator = true
missing-super-call = true
