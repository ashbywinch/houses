<div class="detail__field" id="field-address">
  <div class="detail__field-label">Address</div>
  <div class="detail__field-value">{{ best_address or "—" }}</div>
  <div class="detail__field-provenance">
    <span class="provenance-badge provenance-badge--{{ provenance_class(best_address_source or 'Rightmove') }}">
      {{ best_address_source or "Rightmove" }}
    </span>
    <span class="stale-spinner--fresh" id="spinner-best_address"></span>
  </div>
  <button class="btn btn--sm" hx-get="/properties/{{ rid }}/edit-address" hx-target="#field-address" hx-swap="outerHTML">Edit</button>
</div>
