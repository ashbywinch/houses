<div id="map-picker" class="map-picker">
  <div id="leaflet-map" class="map-picker__map" style="height: 300px;"></div>
  <div class="map-picker__coords">
    <span id="map-picker-lat">{{ lat or '' }}</span>
    <span id="map-picker-lng">{{ lng or '' }}</span>
  </div>
  <form hx-post="/properties/{{ rid }}/enhance" hx-swap="outerHTML" hx-target="#field-location">
    <input type="hidden" name="action" value="location">
    <input type="hidden" name="precise_lat" id="precise_lat" value="">
    <input type="hidden" name="precise_lng" id="precise_lng" value="">
    <button type="submit" class="btn btn--sm" id="map-picker-confirm" disabled>Confirm Location</button>
    <button type="button" class="btn btn--sm btn--ghost" hx-get="/properties/{{ rid }}/field/location" hx-target="#map-picker-container" hx-swap="innerHTML">Cancel</button>
  </form>
</div>
