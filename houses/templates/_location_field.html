<div class="detail__field" id="field-location">
  <div class="detail__field-label">Location</div>
  <div class="detail__field-value">
    {% if best_location is not none %}
    {{ "%.4f"|format(best_location.lat) }}° N &middot; {{ "%.4f"|format(best_location.lon) }}° W
    {% else %}
    —
    {% endif %}
  </div>
  <div class="detail__field-provenance">
    <span class="provenance-badge provenance-badge--{{ provenance_class(best_location_source or '') }}">
      {{ best_location_source or "—" }}
    </span>
    <span class="stale-spinner--fresh" id="spinner-best_location"></span>
  </div>
</div>
