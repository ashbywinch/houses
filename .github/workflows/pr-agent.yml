name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Record start time
        run: echo "REVIEW_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: the-pr-agent/pr-agent@b249e568e0c0fb6c674ace55fe95d02f62f8f3b3
        id: pr-agent
        env:
          OPENAI_KEY: ${{ secrets.OPENCODE_GO_HOUSES_API_KEY }}
          OPENAI_BASE_URL: https://opencode.ai/zen/go/v1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AGENT_CONFIG_BRANCH: ${{ github.head_ref }}

      - name: Check review succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.number }}"
          if [ -z "$PR_NUM" ]; then
            echo "Manual trigger — skipping review check (no PR number)"
            exit 0
          fi
          # PR-Agent uses persistent comments (updates existing comment rather than
          # posting new). The ?since= filter checks created_at, which misses updates.
          # Instead, get all bot comments and compare updated_at to REVIEW_START.
          SINCE="${{ env.REVIEW_START }}"
          NEW_CMTS=$(gh api "repos/${{ github.repository }}/issues/$PR_NUM/comments" --jq "[.[] | select(.user.login == \"github-actions[bot]\" and .updated_at >= \"$SINCE\")]" 2>/dev/null || echo "[]")
          echo "$NEW_CMTS" | jq -e 'length == 0' > /dev/null 2>&1 && NO_COMMENTS=true || NO_COMMENTS=false
          if echo "$NEW_CMTS" | jq -e '.[].body | test("PR Reviewer Guide|PR Code Suggestions")' > /dev/null 2>&1; then
            echo "Review check passed"
          elif echo "$NEW_CMTS" | jq -e '.[].body | test("failed"; "i")' > /dev/null 2>&1; then
            echo "::error::PR-Agent reported a failure:"
            echo "$NEW_CMTS" | jq -r '.[].body'
            exit 1
          elif [ "$NO_COMMENTS" = true ]; then
            echo "::error::PR-Agent posted no comments — review was skipped or failed silently"
            exit 1
          else
            echo "::error::PR-Agent comment found but did not match success or failure pattern"
            echo "$NEW_CMTS" | jq -r '.[].body'
            exit 1
          fi
