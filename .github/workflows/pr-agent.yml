name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: the-pr-agent/pr-agent@b249e568e0c0fb6c674ace55fe95d02f62f8f3b3
        id: pr-agent
        env:
          OPENAI_KEY: ${{ secrets.OPENCODE_GO_HOUSES_API_KEY }}
          OPENAI_BASE_URL: https://opencode.ai/zen/go/v1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Config MUST come from a maintainer-controlled branch: a PR branch
          # could ship its own .pr_agent.toml pointing api_base at an attacker
          # endpoint, and the API key would be sent there as the Bearer token.
          PR_AGENT_CONFIG_BRANCH: pr-agent-config

      - name: Check review succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.number }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${SHA:0:7}"
          if [ -z "$PR_NUM" ]; then
            echo "Manual trigger — skipping review check (no PR number)"
            exit 0
          fi
          # All bot comments for this PR, oldest first.
          CMTS=$(gh api "repos/${{ github.repository }}/issues/$PR_NUM/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]")]' 2>/dev/null || echo "[]")
          # Success: a review/suggestions comment references this commit — full
          # OR short sha, token-bounded so an unrelated hex string (e.g. a hash
          # containing the short sha as a substring) cannot false-positive.
          if echo "$CMTS" | jq -e --arg full "$SHA" --arg short "$SHORT_SHA" \
            '[.[] | select(.body | test("(^|[^0-9a-f])(" + $full + "|" + $short + ")([^0-9a-f]|$)"; "i"))] | length > 0' >/dev/null 2>&1; then
            echo "Review check passed"
          elif echo "$CMTS" | jq -e '[.[] | select(.body | test("failed"; "i"))] | length > 0' >/dev/null 2>&1; then
            echo "::error::PR-Agent reported a failure:"
            echo "$CMTS" | jq -r '.[].body'
            exit 1
          elif [ "$(echo "$CMTS" | jq 'length' 2>/dev/null || echo 0)" = "0" ]; then
            echo "::error::PR-Agent posted no comments for this commit — review was skipped or failed silently"
            exit 1
          else
            echo "::error::PR-Agent comment found but did not match success or failure pattern"
            echo "$CMTS" | jq -r '.[].body'
            exit 1
          fi
