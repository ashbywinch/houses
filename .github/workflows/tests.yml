name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # the coverage comment step needs it

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Setup and install dependencies
        run: make setup

      - name: Lint
        run: make lint-github   # ruff --output-format=github: findings as PR annotations

      - name: Unit tests
        run: make test

      - name: Secret scan
        # Covers files no diff-based reviewer can see (data/commute/* are
        # -diff/linguist-generated). gitleaks reads git objects, so diff
        # attributes don't matter. Version pinned to v8.30.1.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner -v

      - name: Config-drift check (.pr_agent.toml on main vs pr-agent-config branch)
        # Only meaningful on main: the bot reads the branch copy; main's copy is
        # documentation. On PR branches main legitimately lags an in-flight
        # config sync, so running here would false-fail every PR. After a merge
        # the main push run verifies the two didn't drift.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api "repos/${{ github.repository }}/contents/.pr_agent.toml?ref=main" --jq '.content' > /tmp/main_b64 2>/tmp/drift_err
          M1=$?
          gh api "repos/${{ github.repository }}/contents/.pr_agent.toml?ref=pr-agent-config" --jq '.content' > /tmp/config_b64 2>>/tmp/drift_err
          M2=$?
          if [ $M1 -ne 0 ] || [ $M2 -ne 0 ]; then
            echo "::error::config fetch failed (missing pr-agent-config branch?): $(tail -c 400 /tmp/drift_err)"
            exit 1
          fi
          base64 -d /tmp/main_b64 > /tmp/main_copy.toml
          base64 -d /tmp/config_b64 > /tmp/config_copy.toml
          if ! diff -q /tmp/main_copy.toml /tmp/config_copy.toml >/dev/null; then
            echo "::error::.pr_agent.toml on main drifted from the pr-agent-config branch — the bot reads the branch copy; sync them"
            exit 1
          fi

      - name: Coverage
        run: make coverage

      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          thresholds: '80 90'
          format: markdown
          output: both

      - name: Post coverage comment
        # SHA for v3.0.5; same interface as v2 (recreate/path).
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        # Runs when the coverage summary produced the file, even if the gate
        # failed (fail_below_min). hashFiles guards the case where an EARLIER
        # step failed and coverage never ran — the action would otherwise
        # error on the missing file (and recreate: true may delete the last
        # good coverage comment first).
        if: ${{ github.event_name == 'pull_request' && !cancelled() && hashFiles('code-coverage-results.md') != '' }}
        with:
          recreate: true
          path: code-coverage-results.md
