name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # the coverage comment step needs it

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Setup and install dependencies
        run: make setup

      - name: Lint
        run: make lint-github   # ruff --output-format=github: findings as PR annotations

      - name: Unit tests
        run: make test

      - name: Coverage
        run: make coverage

      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          thresholds: '80 90'
          format: markdown
          output: both

      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
