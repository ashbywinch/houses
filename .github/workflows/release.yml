name: Release

permissions:
  contents: read

# The rollout chain (docs/anti-fragile-rollout-plan.md). ONE human decision per
# rollout: the cutover job's production-environment approval.
#
#   resolve   — read the L4 forwarding rule's target. That is the ONLY "who is
#               live" fact; a box's role (owner/standby) is exactly that target.
#   build     — build the content-addressed artifact (code + frontend/dist +
#               relocatable .venv + units + tooling + manifest) and upload it to
#               gs://houses-artifacts/<sha256>.tar.gz. The sha256 IS the key.
#   provision — rebuild the STANDBY instance from the artifact (replace-not-repair,
#               guarded against the box the rules target). Part of every rollout.
#   install   — on the fresh standby: verify the artifact + its venv, rehearse the
#               migrations (apply + check each), smoke on 127.0.0.1, then leave the
#               app STOPPED for the human gate.
#   cutover   — GATED (environment: production). FREEZE the owner (stop its app)
#               and snapshot it → rebase the standby from that snapshot (restore +
#               verify rows/integrity + migrate + check + start) → flip the rules
#               → settle. Any failure restarts the owner's app; traffic never moved.
#   rollback  — flip the rules back to the other box. Ungated: the emergency undo.
#   recover   — UNGATED rollout PREP. The EXCEPTION path: restore the
#               standby's database from a NAMED object (never from the owner)
#               and serve it as the REVIEW SURFACE at houses-smoke. NO traffic
#               change, NO production state touched. The human reviews the
#               RESTORED box, then `flip` (below, gated) makes it live.
#   flip      — GATED (environment: production). The recover-rollout flip: make
#               the APPROVED review box live and NOTHING else. Invariant: once
#               the smoke box is user-approved, the flip MUST NOT change anything
#               on that box except make it live — no restore, no rebase, no
#               migrate, no DB touch. It writes the production role URL (the app
#               restarts to read it), retires the smoke relay, stops the
#               abandoned box's app, points the L4 rules at the approved box,
#               and watches public health through the settle window.
#   diagnose  — read-only state dump of BOTH boxes.
#   scaffold  — one-time, GREENFIELD only: the two boxes + target instances +
#               the L4 rules, when no rules exist yet. Requires houses-base
#               (run action=bake first); a missing image or an existing plane
#               fails the job loudly — there is no fallback bootstrap.
#   DOUBLE GATE on every traffic move (cutover / flip):
#   (1) the job declares environment: production — GitHub pauses it until the
#       required human reviewer approves, and (2) the job's first step refuses
#       to run unless the dispatch carried approval=approved. Both must hold;
#       neither alone may move traffic (2026-10-02: the environment had no
#       protection rules configured, so a flip autopassed the gate and ran).
#
# The box never flips routes and holds no GCP credentials; CI does the flip with
# its own service account. The box's only identity is its instance service
# account, used for GCS reads (no key file on a box, none in Terraform state).
#
# Required repo secrets:
#   BOX_USER, BOX_SSH_KEY   restricted deploy key (forced-command allowlist)
#   DEPLOY_PUBKEY           that key's PUBLIC half (allowlist install)
#   OPERATOR_PUBKEY         the human admin key (break-glass: shell + sudo)
#   GOOGLE_SA_KEY           base64 SA JSON: compute.instanceAdmin.v1,
#                           compute.networkUser, storage.objectAdmin on
#                           houses-artifacts, and the houses-tfstate backend
# Repo variables (optional): GCP_PROJECT, GCP_ZONE.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'git ref to build/release (SHA, branch, or tag)'
        required: false
        default: 'main'
      action:
        description: 'release | build | install | cutover | rollback | recover | flip | diagnose | provision | bake | scaffold'
        required: false
        default: 'release'
        type: choice
        options: ['release', 'build', 'install', 'cutover', 'rollback', 'recover', 'flip', 'diagnose', 'provision', 'bake', 'scaffold']
      artifact:
        description: 'install only: an existing gs://<bucket>/<sha256>.tar.gz (blank = build one now)'
        required: false
        default: ''
      snapshot:
        description: 'recover only: the database object to restore (gs://bucket/object.db)'
        required: false
        default: 'gs://houses-seed/latest.db'
      approval:
        description: 'flip/cutover only: explicit human approval to move traffic. REQUIRED: approved — anything else fails the job before any box or traffic operation'
        required: false
        default: 'pending'
        type: choice
        options: ['pending', 'approved']

jobs:
  # ── who is live ───────────────────────────────────────────────────────
  resolve:
    if: ${{ inputs.action != 'build' }}
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.roles.outputs.owner }}
      standby: ${{ steps.roles.outputs.standby }}
      owner_ip: ${{ steps.roles.outputs.owner_ip }}
      standby_ip: ${{ steps.roles.outputs.standby_ip }}
      target: ${{ steps.roles.outputs.target }}
      consistent: ${{ steps.roles.outputs.consistent }}
    steps:
      - name: Authenticate gcloud
        run: |
          set -euo pipefail
          printf '%s\n' "$GOOGLE_SA_KEY" | base64 -d > /tmp/sa.json
          chmod 600 /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json >/dev/null 2>&1
          rm -f /tmp/sa.json
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
      - id: roles
        name: Read the rules' targets (the only "who is live" fact)
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT || 'houses-498215' }}"
          ZONE="${{ vars.GCP_ZONE || 'us-west1-a' }}"
          REGION="${ZONE%-*}"
          describe() { gcloud compute instances describe "$1" --zone "$ZONE" --project "$PROJECT" --format="value($2)"; }
          rule_target() { basename "$(gcloud compute forwarding-rules describe "$1" --region "$REGION" --project "$PROJECT" --format='value(target)')"; }

          # The two rules are always flipped together. A split means a half-flip:
          # report it and carry on resolving, because REFUSING HERE would make
          # rollback and diagnose — the two actions you need in that state —
          # impossible to dispatch. Jobs that must not act on a split check
          # `consistent` themselves.
          TARGET=$(rule_target houses-l4-https)
          TARGET_HTTP=$(rule_target houses-l4-http)
          if [ -z "$TARGET" ]; then
            # GREENFIELD: no rules exist yet — only bake/scaffold are valid.
            # Not an error: consumers gate on `consistent`.
            echo "::warning::no L4 rules yet — greenfield. action=bake and action=scaffold only, until scaffold creates the plane."
            echo "owner="
            echo "standby="
            echo "owner_ip="
            echo "standby_ip="
            echo "target="
            echo "consistent=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TARGET" = "$TARGET_HTTP" ]; then
            CONSISTENT=true
          else
            CONSISTENT=false
            echo "::warning::the L4 rules DISAGREE (https -> $TARGET, http -> $TARGET_HTTP) — a half-finished flip. action=rollback repairs this; cutover/install/recover refuse it."
          fi
          OWNER=$(basename "$(gcloud compute target-instances describe "$TARGET" --zone "$ZONE" --project "$PROJECT" --format='value(instance)')")
          case "$OWNER" in
            houses) STANDBY=houses-standby ;;
            houses-standby) STANDBY=houses ;;
            *) echo "::error::the rule targets an unknown instance '$OWNER'"; exit 1 ;;
          esac
          OWNER_IP=$(describe "$OWNER" networkInterfaces[0].accessConfigs[0].natIP)
          STANDBY_IP=$(describe "$STANDBY" networkInterfaces[0].accessConfigs[0].natIP)
          {
            echo "owner=$OWNER"
            echo "standby=$STANDBY"
            echo "owner_ip=$OWNER_IP"
            echo "standby_ip=$STANDBY_IP"
            echo "target=$TARGET"
            echo "consistent=$CONSISTENT"
          } >> "$GITHUB_OUTPUT"
          echo "LIVE (rule target): $OWNER ($OWNER_IP) via $TARGET"
          echo "STANDBY:            $STANDBY ($STANDBY_IP)"

  # ── the artifact ──────────────────────────────────────────────────────
  image-stale:
    # Runs for every chain that consumes the image; emits drifted=true when
    # the baked image no longer matches main's bake source — the chain then
    # RE-BAKES in the same run (no human), because a stale image is a stale box.
    # The flip consumes NO image and NO artifact — the approved box is the
    # contract; a stale image must never gate it.
    if: ${{ inputs.action == 'release' || inputs.action == 'provision' || inputs.action == 'install' || inputs.action == 'cutover' }}
    runs-on: ubuntu-latest
    outputs:
      wanted: ${{ steps.check.outputs.wanted }}
    env:
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Compare the image's bake_ref to main's bake source
        id: check
        run: |
          set -euo pipefail
          printf '%s\n' "$GOOGLE_SA_KEY" | base64 -d > /tmp/sa.json
          chmod 600 /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json >/dev/null 2>&1
          rm -f /tmp/sa.json
          PROJECT="${{ vars.GCP_PROJECT || 'houses-498215' }}"
          WANTED=$(bash tools/deploy/bake-ref.sh)
          BAKED=$(gcloud compute images describe "${{ vars.GCP_BASE_IMAGE || 'houses-base' }}" --project "$PROJECT" \
                    --format='value(description)' 2>/dev/null | grep -o 'bake_ref=[0-9a-f]\{64\}' | cut -d= -f2 || true)
          if [ -z "$BAKED" ]; then
            echo "::error::image has no bake_ref — the bake image pipeline has not stamped it; wait for action=bake/pipeline then re-run"
            exit 1
          fi
          if [ "$BAKED" != "$WANTED" ]; then
            echo "::error::image source drifted (image=$BAKED main=$WANTED) — the bake pipeline must re-bake before this release; re-run after it lands"
            exit 1
          fi
          echo "image source matches main ($BAKED)"
          echo "wanted=$WANTED" >> "$GITHUB_OUTPUT"
  build:
    if: ${{ github.event_name == 'push' || inputs.action == 'release' || inputs.action == 'build' || inputs.action == 'provision' || inputs.action == 'install' || inputs.action == 'recover' }}
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.pack.outputs.artifact }}
      sha: ${{ steps.pack.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
      - name: Guard — released ref must be on main (tags) or explicitly dispatched
        env:
          REF: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
        run: |
          set -euo pipefail
          # The ref is interpolated into a remote shell command below — refuse
          # anything outside the safe charset (PR #68 review, command injection).
          case "$REF" in
            *[!A-Za-z0-9._/-]*)
              echo "ERROR: ref '$REF' contains characters outside [A-Za-z0-9._/-] — refusing to deploy." >&2
              exit 1
              ;;
          esac
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Tag push — verifying $REF is reachable from main..."
            git init -q .
            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "https://github.com/${{ github.repository }}.git"
            else
              git remote add origin "https://github.com/${{ github.repository }}.git"
            fi
            git fetch -q --filter=blob:none origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/tags/$REF:refs/tags/$REF"
            if ! git merge-base --is-ancestor "$REF" origin/main; then
              echo "ERROR: tag $REF is not reachable from main. Merge the PR first, then re-tag main." >&2
              exit 1
            fi
          else
            echo "workflow_dispatch with ref=$REF"
            if [ "$REF" != "main" ]; then
              echo "NOTE: releasing non-main ref $REF — the deliberate, reviewable bypass."
            fi
          fi
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Build the frontend (never on the box — a Vite build is the 2026-09-07 OOM victim)
        run: |
          set -euo pipefail
          cd houses/frontend
          npm ci
          npm run build
          test -f dist/index.html
      - id: pack
        name: Pack the artifact (relocatable venv + code + dist + tooling)
        run: |
          set -euo pipefail
          REF="${{ github.event_name == 'push' && github.ref_name || inputs.ref }}"
          STAGE=/tmp/houses-artifact
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          # EXACTLY the tracked tree: it carries the app AND the committed
          # reference data the app reads from relative paths at runtime
          # (data/commute/*.json for the map layers, schools/council-tax/bus-fare
          # tables). A hand-written exclude list shipped none of those once and
          # the only symptom was silently-empty derived data, so exclude nothing
          # by hand: `.gitignore` and git's own index are the single source of
          # what belongs in the artifact.
          git archive HEAD | tar -x -C "$STAGE"
          # The frontend build is CI's output, not tracked content — overlay it.
          rm -rf "$STAGE/houses/frontend/dist"
          cp -r houses/frontend/dist "$STAGE/houses/frontend/dist"
          test -f "$STAGE/houses/frontend/dist/index.html"
          echo "$REF" > "$STAGE/ARTIFACT_REF"
          # A RELOCATABLE venv with the project installed NON-EDITABLE: an
          # editable venv embeds absolute build paths (shebangs + __editable__
          # .pth), so it cannot import houses/dag after unpacking elsewhere —
          # which is exactly how the 2026-09-24 flip aborted.
          export UV_PROJECT_ENVIRONMENT="$STAGE/.venv"
          uv venv --relocatable "$STAGE/.venv"
          uv sync --no-editable --frozen
          # Prove it moved: unpack elsewhere and import the app + the DAG library.
          PROOF=/tmp/houses-artifact-proof
          rm -rf "$PROOF"; mkdir -p "$PROOF"
          tar -cf - -C "$STAGE" . | tar -xf - -C "$PROOF"
          ( cd / && "$PROOF/.venv/bin/python" -c 'import houses, dag' )
          echo "venv receipt ok: the packed .venv imports houses + dag from $PROOF"
          rm -rf "$PROOF"
          # Pack, then hash the FILE: the object key must be the sha256 of the
          # exact bytes served, or the box's verification would be meaningless.
          tar -czf /tmp/houses-artifact.tar.gz -C "$STAGE" .
          SHA=$(sha256sum /tmp/houses-artifact.tar.gz | cut -d' ' -f1)
          mv /tmp/houses-artifact.tar.gz "/tmp/$SHA.tar.gz"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "artifact=gs://houses-artifacts/$SHA.tar.gz" >> "$GITHUB_OUTPUT"
          du -h "/tmp/$SHA.tar.gz"
      - name: Authenticate gcloud
        run: |
          set -euo pipefail
          printf '%s\n' "$GOOGLE_SA_KEY" | base64 -d > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json >/dev/null 2>&1
          rm -f /tmp/sa.json
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
      - name: Upload the artifact (the object KEY is its sha256)
        run: |
          set -euo pipefail
          SHA="${{ steps.pack.outputs.sha }}"
          gsutil -q cp "/tmp/$SHA.tar.gz" "gs://houses-artifacts/$SHA.tar.gz"
          gsutil ls -l "gs://houses-artifacts/$SHA.tar.gz"

  # ── install on the standby (the rehearsal) ────────────────────────────
  install:
    needs: [resolve, build, provision, image-stale]
    # A rollout rebuilds the standby first (provision) and then installs this
    # artifact onto it; `action=install` re-installs onto the existing box
    # without a rebuild (a retry after a failed install, or a hotfix probe).
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.consistent == 'true' && needs.image-stale.result == 'success' && (inputs.action == 'install' || needs.provision.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      BOX_USER: ${{ secrets.BOX_USER }}
      BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
      ARTIFACT: ${{ inputs.artifact != '' && inputs.artifact || needs.build.outputs.artifact }}
      STANDBY_IP: ${{ needs.provision.outputs.standby_ip || needs.resolve.outputs.standby_ip }}
    steps:
      - name: Guard — never install onto the box that owns the traffic
        run: |
          set -euo pipefail
          if [ "${{ needs.resolve.outputs.standby }}" = "${{ needs.resolve.outputs.owner }}" ]; then
            echo "::error::resolve returned the same box for owner and standby — refusing"
            exit 1
          fi
          case "$ARTIFACT" in
            gs://*/[0-9a-f]*.tar.gz) : ;;
            *) echo "::error::no artifact to install (build one, or pass artifact=gs://<bucket>/<sha256>.tar.gz)"; exit 1 ;;
          esac
          echo "installing $ARTIFACT on the standby ${{ needs.resolve.outputs.standby }} ($STANDBY_IP)"
      - name: Install the artifact on the standby
        run: |
          set -euo pipefail
          printf '%s\n' "$BOX_SSH_KEY" > /tmp/deploy.key
          chmod 600 /tmp/deploy.key
          ssh -i /tmp/deploy.key -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            "$BOX_USER@$STANDBY_IP" "sudo /opt/houses/install-artifact.sh $ARTIFACT"
        timeout-minutes: 90
      - name: Surface the standby's state (best-effort)
        if: failure()
        run: |
          set +e
          printf '%s\n' "$BOX_SSH_KEY" > /tmp/deploy.key
          chmod 600 /tmp/deploy.key
          ssh -i /tmp/deploy.key -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            "$BOX_USER@$STANDBY_IP" "sudo /opt/houses/switch.sh --diagnose" \
            || echo "standby unreachable — check the console"
        timeout-minutes: 3
      - name: Bring the OWNER's tooling current (tooling-only refresh)
        # The owner's only install is its bootstrap; its /opt/houses scripts
        # would otherwise lag every artifact generation and lack verbs the
        # release uses on it (2026-09-30: the smoke relay died on the owner's
        # stale switch.sh). The deploy key is allowlisted for install-artifact.sh.
        run: |
          set -euo pipefail
          printf '%s\n' "$BOX_SSH_KEY" > /tmp/deploy.key
          chmod 600 /tmp/deploy.key
          ssh -i /tmp/deploy.key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$BOX_USER@${{ needs.resolve.outputs.owner_ip }}" \
            "sudo /opt/houses/install-artifact.sh --tooling-only $ARTIFACT"
        timeout-minutes: 15
      - name: Build the smoke review surface (owner Caddy relays the standby)
        # The human review surface of the rollout: houses-smoke must show the
        # fresh STANDBY, wired by the process — never by hand. The deploy key
        # is allowlisted for switch.sh on every box; gcloud (for the standby's
        # internal IP) runs as the CI SA.
        run: |
          set -euo pipefail
          printf '%s\n' "$GOOGLE_SA_KEY" | base64 -d > /tmp/sa.json
          chmod 600 /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json >/dev/null 2>&1
          rm -f /tmp/sa.json
          printf '%s\n' "$BOX_SSH_KEY" > /tmp/deploy.key
          chmod 600 /tmp/deploy.key
          PROJECT="${{ vars.GCP_PROJECT || 'houses-498215' }}"
          ZONE="${{ vars.GCP_ZONE || 'us-west1-a' }}"
          SB_INT=$(gcloud compute instances describe "${{ needs.resolve.outputs.standby }}" \
            --zone "$ZONE" --project "$PROJECT" --format='value(networkInterfaces[0].networkIP)')
          OWNER_IP="${{ needs.resolve.outputs.owner_ip }}"
          echo "smoke relay: $OWNER_IP -> $SB_INT"
          ssh -i /tmp/deploy.key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$BOX_USER@$OWNER_IP" "sudo /opt/houses/switch.sh --smoke-relay $SB_INT"
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        timeout-minutes: 5

  # ── cutover (THE human gate) ──────────────────────────────────────────
  cutover:
    needs: [resolve, image-stale]
    if: ${{ inputs.action == 'cutover' && needs.resolve.outputs.consistent == 'true' && needs.image-stale.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      BOX_USER: ${{ secrets.BOX_USER }}
      BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
      OWNER_IP: ${{ needs.resolve.outputs.owner_ip }}
      STANDBY_IP: ${{ needs.resolve.outputs.standby_ip }}
    steps:
      - name: Human approval gate — a traffic move may not start without it
        if: ${{ inputs.approval != 'approved' }}
        run: |
          echo "::error::action=${{ inputs.action }} moves production traffic, and this dispatch did not carry approval=approved. Nothing ran — no box command, no traffic change. Re-dispatch with -f approval=approved ONLY after the human has approved the surface."
          exit 1
      - name: Prepare the deploy key
        run: |
          set -euo pipefail
          printf '%s\n' "$BOX_SSH_KEY" > /tmp/deploy.key
          chmod 600 /tmp/deploy.key
      - name: Authenticate gcloud
        run: |
          set -euo pipefail
          printf '%s\n' "$GOOGLE_SA_KEY" | base64 -d > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json >/dev/null 2>&1
          rm -f /tmp/sa.json
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
      - id: snapshot
        name: FREEZE the owner and snapshot its database
        run: |
          set -euo pipefail
          # --snapshot STOPS the owner's app first (the freeze), so no write can
          # land between the freeze and the copy: what CI gets is exactly the last
          # state production served, and the row count it reports is what the
          # restore is verified against. Production is down from here until the
          # flip completes (or until the unfreeze step restarts this box).
          ssh -i /tmp/deploy.key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            "$BOX_USER@$OWNER_IP" "sudo /opt/houses/switch.sh --snapshot" \
            > /tmp/snapshot.db 2> /tmp/snapshot.err
          cat /tmp/snapshot.err
          echo "frozen_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          ROWS=$(sed -n 's/.*snapshot ok: \([0-9]*\) rows.*/\1/p' /tmp/snapshot.err | tail -1)
          [ -n "$ROWS" ] || { echo "::error::the snapshot reported no row count — production is FROZEN; check the box"; exit 1; }
          [ -s /tmp/snapshot.db ] || { echo "::error::the snapshot stream is empty — production is FROZEN; check the box"; exit 1; }
          echo "snapshot: $(du -h /tmp/snapshot.db | cut -f1), $ROWS rows"
          echo "rows=$ROWS" >> "$GITHUB_OUTPUT"
          # ARCHIVE the clean pre-migration copy before any migration runs on the
          # restores: this object is the "backup taken before the migration" that
          # must survive the flip. NEVER delete it once the runner has migrated
          # the standby — the naming and the bytes are the point (the 09-23 seed
          # that had no surviving clean copy was the 2026-09-24 lesson).
          SNAPSHOT_OBJECT="gs://houses-artifacts/snapshots/$(date -u +%Y%m%dT%H%M%SZ).db"
          gsutil -q cp /tmp/snapshot.db "$SNAPSHOT_OBJECT" || {
            echo "::error::could not archive the clean snapshot to $SNAPSHOT_OBJECT — the cutover rule is: no archive, no migration. Production is FROZEN; the unfreeze step restarts the owner."
            exit 1
          }
          echo "archived clean snapshot: $SNAPSHOT_OBJECT ($(du -h /tmp/snapshot.db | cut -f1), $ROWS rows, pre-migration)"
          echo "snapshot_object=$SNAPSHOT_OBJECT" >> "$GITHUB_OUTPUT"
        timeout-minutes: 20
      - name: Rebase the standby (restore, verify, migrate, check, start)
        run: |
          set -euo pipefail
          # --rebase reads the snapshot on stdin and passes the snapshot's row
          # count, which the box verifies the restore against before installing it.
          # Any failure here leaves the standby's app stopped; the unfreeze step
          # below restarts the owner, so traffic never moves onto a bad copy.
          # The recovered box becomes the OWNER: write the production role URL
          # in its OWN ssh call first (the rebase's start reads the env).
          # ONE sanctioned shape per ssh: the deploy-key allowlist matches the
          # WHOLE remote command string exactly, so `--public-url X && --rebase Y`
          # in one call matches NOTHING and is a silent no-op — exit 0, nothing
          # run (2026-10-03: that is exactly what the recover prep and this
          # rebase had been doing).
          ssh -i /tmp/deploy.key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$BOX_USER@$STANDBY_IP" "sudo /opt/houses/switch.sh --public-url https://houses.blueumbrella.net"
          cat /tmp/snapshot.db | ssh -i /tmp/deploy.key -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            "$BOX_USER@$STANDBY_IP" "sudo /opt/houses/switch.sh --rebase ${{ steps.snapshot.outputs.rows }}"
          # The GCS copy is now the archive; the runner's own <db>.pre-<basename>
          # backups live on the standby/owner box. Nothing further is deleted.
        # Restore + the migration pair. The node_results split migration is a
        # one-off mass rewrite (measured ~70 min for a 246k-row database: every
        # row's provenance is decompressed and recompressed individually), so
        # this window must hold it until every box has been through it once.
        timeout-minutes: 120
      - name: Flip the L4 rules to the new owner
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT || 'houses-498215' }}"
          ZONE="${{ vars.GCP_ZONE || 'us-west1-a' }}"
          REGION="${ZONE%-*}"
          TARGET="${{ needs.resolve.outputs.standby }}-target"
          for rule in houses-l4-http houses-l4-https; do
            gcloud compute forwarding-rules set-target "$rule" --region "$REGION" --project "$PROJECT" \
              --target-instance "$TARGET" \
              --target-instance-zone "$ZONE"
          done
          echo "flipped houses-l4-http + houses-l4-https -> $TARGET"
      - name: Unfreeze — put production back on the owner if anything above failed
        # failure() is FALSE for a cancelled run, and a lost runner runs no
        # further steps: either way the owner's app has been stopped since the
        # snapshot and production is down. Both cases must unfreeze.
        if: ${{ failure() || cancelled() }}
        run: |
          set +e
          # The owner's app has been stopped since the snapshot. Traffic never
          # moved (the flip is the last step), so restarting it restores service
          # exactly as it was — with the writes it had already accepted.
          echo "cutover failed after the freeze — restarting the owner's app"
          ssh -i /tmp/deploy.key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            "$BOX_USER@$OWNER_IP" "sudo /opt/houses/switch.sh --unfreeze"
        timeout-minutes: 10
      - name: Verify public health through the settle window (5 minutes)
        if: success()
        run: |
          set -euo pipefail
          # The settle window: five minutes of continuous public verification on
          # the NEW owner. /health is the evidence that the box is SERVING
          # (`status` and `db` are hard gates). It is NOT evidence that the data
          # is migrated — that verdict comes from the runner inside --rebase
          # (`migrations: N applied+checked, 0 failed`), which the box refuses to
          # finish without, long before any traffic moves.
          #
          # last_write staleness is reported, not gated: it is MAX(created_at) in
          # node_results, so an idle-but-converged DAG legitimately writes nothing
          # for minutes at a time. A genuinely stalled database shows `db:"error"`.
          deadline=$(( $(date +%s) + 300 ))
          polls=0
          first=""
          last=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            H=$(curl -s -m 10 https://houses.blueumbrella.net/health 2>/dev/null || true)
            read -r S DB LW < <(printf '%s' "$H" | python3 -c 'import sys,json; d=json.loads(sys.stdin.read()); print(d.get("status",""), d.get("db",""), d.get("last_write",""))' 2>/dev/null || echo "  ")
            if [ "$S" != "ok" ] || [ "$DB" != "ok" ] || [ -z "$LW" ]; then
              echo "::error::public health is not ok (status='$S' db='$DB' last_write='$LW') — the flip is NOT complete"
              exit 1
            fi
            AGE=$(( $(date -u +%s) - $(date -u -d "${LW}" +%s 2>/dev/null || echo 0) ))
            [ -n "$first" ] || first="$LW"
            last="$LW"
            polls=$((polls + 1))
            echo "settle poll $polls: last_write=$LW age=${AGE}s"
            sleep 15
          done
          if [ "$first" = "$last" ]; then
            echo "NOTE: last_write did not advance during the window ($last) — the app had nothing to recompute"
          fi
          echo "SETTLE VERIFIED: $polls healthy reads over 5 minutes (last_write $first -> $last)"
      - name: Record the outcome
        if: always()
        run: |
          echo "owner before:  ${{ needs.resolve.outputs.owner }}"
          echo "owner after:   ${{ needs.resolve.outputs.standby }}"
          echo "Rollback (if needed): gh workflow run Release -f action=rollback -f ref=main"
          echo "Clean pre-migration backups retained: ${{ steps.snapshot.outputs.snapshot_object }} (GCS) + each box's <db>.pre-<migration> files"

  # ── flip: make the APPROVED review box live, nothing else ─────────────
  # Recover-rollout flip. The approved box is FINAL: prep already restored
  # the database, wrote the FINAL production role URL and started the app,
  # and the surface was health-verified. After approval NOTHING changes on
  # that box — no install, no tooling, no role URL, no restart, no DB op;
  # this job only retires the smoke relay on the abandoned owner and moves
  # the traffic rules (2026-10-03: the box must be exactly what was
  # approved, so every box-side action moved before the gate).
  flip:
    needs: [resolve]
    if: ${{ inputs.action == 'flip' && needs.resolve.outputs.consistent == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      BOX_USER: ${{ secrets.BOX_USER }}
      BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
      OWNER_IP: ${{ needs.resolve.outputs.owner_ip }}
    steps:
      - name: Human approval gate — a traffic move may not start without it
        if: ${{ inputs.approval != 'approved' }}
        run: |
          echo "::error::action=${{ inputs.action }} moves production traffic, and this dispatch did not carry approval=approved. Nothing ran — no box command, no traffic change. Re-dispatch with -f approval=approved ONLY after the human has approved the surface."
          exit 1
      - name: Prepare the deploy key
        run: |
          set -euo pipefail
          printf '%s\n' "$BOX_SSH_KEY" > /tmp/deploy.key
          chmod 600 /tmp/deploy.key
      - name: Authenticate gcloud
        run: |
          set -euo pipefail
          printf '%s\n' "$GOOGLE_SA_KEY" | base64 -d > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json >/dev/null 2>&1
          rm -f /tmp/sa.json
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
      - name: Preflight — ops safety, not acceptance
        run: |
          set -euo pipefail
          # Acceptance already happened: the user approved this box on the
          # review surface. This check is ops safety only — if the approved
          # surface stopped serving, nothing is flipped (docs/rollout-prd.md,
          # §7). Checked from the runner (no box command): the smoke hostname
          # routes to the approved app — exactly the surface the user approved.
          H=$(curl -sS -m 15 https://houses-smoke.blueumbrella.net/health)
          printf '%s' "$H" | grep -E '"status":"ok"' >/dev/null || { echo "::error::the approved surface is not serving: $H"; exit 1; }
          echo "preflight ok: approved surface is serving"
      - name: Flip the L4 rules to the approved box
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT || 'houses-498215' }}"
          ZONE="${{ vars.GCP_ZONE || 'us-west1-a' }}"
          REGION="${ZONE%-*}"
          TARGET="${{ needs.resolve.outputs.standby }}-target"
          for rule in houses-l4-http houses-l4-https; do
            gcloud compute forwarding-rules set-target "$rule" --region "$REGION" --project "$PROJECT" \
              --target-instance "$TARGET" \
              --target-instance-zone "$ZONE"
          done
          echo "flipped houses-l4-http + houses-l4-https -> $TARGET"
      - name: Darken — retire the smoke relay (the only owner op)
        run: |
          set -euo pipefail
          # The old owner's Caddy stops relaying houses-smoke (the review
          # surface ends at approval). Nothing else touches the owner — no
          # install, no stop verb, no data change (docs/rollout-prd.md, R5).
          # The abandoned box keeps running until a later cleanup; its files
          # and DB stay exactly as they were (the pre-flip archive).
          ssh -i /tmp/deploy.key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$BOX_USER@$OWNER_IP" "sudo /opt/houses/switch.sh --smoke-relay off"
      - name: Continuity probe — public health responds (not acceptance)
        if: success()
        run: |
          set -euo pipefail
          # Acceptance happened on the review surface BEFORE the flip (the
          # user approval); the flip changes nothing about the approved box.
          # This probe only confirms the moved site responds promptly. A
          # failure is an anomaly to investigate or roll back — it is NOT a
          # stability gate; nothing is approved or waited-into-shape after the
          # flip (docs/rollout-prd.md, §1 and §7).
          ok=""
          for i in $(seq 1 12); do
            H=$(curl -s -m 10 https://houses.blueumbrella.net/health 2>/dev/null || true)
            S=$(printf '%s' "$H" | python3 -c 'import sys,json; print(json.loads(sys.stdin.read()).get("status",""))' 2>/dev/null || true)
            [ "$S" = "ok" ] && { echo "probe $i: public health ok"; ok=1; break; }
            echo "probe $i: not healthy yet"
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error::public health did not come up after the flip — investigate or rollback"; exit 1; }
          # DAG convergence is reported, never gated: the approved box
          # converged during its review; a fresh-cutover boot's background
          # sweep is expected and reads never block on it.
          echo "CONTINUITY OK: public site serving on the approved box"
      - name: Record the outcome
        if: always()
        run: |
          echo "approved box: ${{ needs.resolve.outputs.standby }} (was the smoke surface; now production)"
          echo "abandoned box: ${{ needs.resolve.outputs.owner }} (app stopped, relay retired — its DB kept as-is)"
          echo "Rollback (if needed): gh workflow run Release -f action=rollback -f ref=main"

  # ── recover: RESTORE-only rollout PREP from a NAMED OBJECT (UNGATED) ──
  #
  # The exception path, for when the owner's data must NOT be carried forward
  # (a silent migration skip, a stalled cascade, a botched restore). The owner
  # is never read and never snapshotted: the STANDBY's database comes from the
  # object a human names — deliberately, in an incident, not automatically
  # from a pile of old copies. Recovery means the writes since that object are
  # gone; that trade is accepted at the FLIP's approval, never here.
  #
  # UNGATED BY DESIGN: this job only prepares the standby — restore + serve
  # the review surface at houses-smoke. It moves NO traffic and touches NO
  # production state. The human then approves the RESTORED, SERVING box, and
  # `flip` (gated, next) makes it live WITHOUT touching the DB. 2026-10-02:
  # recover used to restore AFTER its approval gate and then flip — the box
  # that went live was never the one approved; the split IS the invariant.
  recover:
    needs: [resolve, build]
    if: ${{ inputs.action == 'recover' && needs.resolve.outputs.consistent == 'true' }}
    runs-on: ubuntu-latest
    env:
      BOX_USER: ${{ secrets.BOX_USER }}
      BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
      STANDBY_IP: ${{ needs.resolve.outputs.standby_ip }}
      SOURCE: ${{ inputs.snapshot || 'gs://houses-seed/latest.db' }}
    steps:
      - name: Guard — never recover onto the box that owns the traffic
        run: |
          set -euo pipefail
          if [ "${{ needs.resolve.outputs.standby }}" = "${{ needs.resolve.outputs.owner }}" ]; then
            echo "::error::resolve returned the same box for owner and standby — refusing"
            exit 1
          fi
          case "$SOURCE" in
            gs://*/*.db) : ;;
            *) echo "::error::snapshot must name an object: gs://<bucket>/<object>.db"; exit 1 ;;
          esac
          echo "preparing ${{ needs.resolve.outputs.standby }} from $SOURCE"
          echo "::warning::the owner (${{ needs.resolve.outputs.owner }}) is NOT read — its data is being abandoned, and every write since $SOURCE is lost"
      - name: Install the current artifact on the standby (app + tooling)
        run: |
          set -euo pipefail
          # The box must be FINAL before approval — the APP CODE included (the
          # host-aware OAuth fix is what lets the reviewer sign in on the
          # review hostname while the box already carries its production role
          # URL). install-artifact.sh stops the app, swaps the tree, proves the
          # venv, rehearses the migrations on the box's current database and
          # smokes; the restore below then lays down the named object.
          printf '%s\n' "$BOX_SSH_KEY" > /tmp/deploy.key
          chmod 600 /tmp/deploy.key
          ssh -i /tmp/deploy.key -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            "$BOX_USER@$STANDBY_IP" "sudo /opt/houses/install-artifact.sh ${{ needs.build.outputs.artifact }}"
        timeout-minutes: 90
      - name: Set the FINAL production role URL on the standby
        run: |
          set -euo pipefail
          printf '%s\n' "$BOX_SSH_KEY" > /tmp/deploy.key
          chmod 600 /tmp/deploy.key
          # The box must be FINAL before the human approves it: production
          # role URL written FIRST (the restore's start reads the env), in
          # its OWN ssh call. ONE sanctioned shape per ssh: the deploy-key
          # allowlist matches the WHOLE remote command string exactly, so
          # `--public-url X && --restore Y` in one call matches NOTHING and
          # is a silent no-op — exit 0, nothing run (2026-10-03).
          ssh -i /tmp/deploy.key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$BOX_USER@$STANDBY_IP" "sudo /opt/houses/switch.sh --public-url https://houses.blueumbrella.net"
      - name: Restore the named database and start the app as the review surface
        run: |
          set -euo pipefail
          ssh -i /tmp/deploy.key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            "$BOX_USER@$STANDBY_IP" "sudo /opt/houses/switch.sh --restore $SOURCE"
        # Restore + the migration pair — the same one-off split migration as
        # the cutover's rebase (see the window above).
        timeout-minutes: 120
      - name: Record the surface the reviewer will look at
        run: |
          echo "REVIEW SURFACE: the approved box is FINAL (production role URL)."
          echo "Review it through https://houses-smoke.blueumbrella.net (the owner relays to it)."
          echo "NOTE: OAuth callbacks use the production URL by design — signing in on the"
          echo "review hostname redirects to the production hostname."
      - name: Verify the review surface serves before REVIEW READY
        run: |
          set -euo pipefail
          # The human approves the SERVING box — never a promise. The restored
          # app on an e2-micro can take minutes to become healthy; poll the
          # EXTERNAL smoke hostname (the whole chain: owner's relay ->
          # standby -> app -> restored DB) up to 10 minutes.
          ok=0
          for i in $(seq 1 60); do
            H=$(curl -sS -m 10 https://houses-smoke.blueumbrella.net/health 2>/dev/null || true)
            printf '%s' "$H" | grep -qE '"status":"ok"' && { echo "review surface serving (poll $i): $H"; ok=1; break; }
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::the review surface did not become healthy — re-run action=recover after diagnosing (journalctl -u houses.service)"; exit 1; }
          echo "REVIEWABLE: https://houses-smoke.blueumbrella.net serves the restored $SOURCE"
      - name: REVIEW READY — the traffic move is `flip`, gated
        run: |
          echo "REVIEW READY: ${{ needs.resolve.outputs.standby }} serves $SOURCE at https://houses-smoke.blueumbrella.net"
          echo "The box is FINAL: production role URL, restored DB, app running, surface verified."
          echo "The owner (${{ needs.resolve.outputs.owner }}) still serves production, untouched."
          echo "To promote after review (NOTHING changes on the approved box):"
          echo "  gh workflow run Release -f action=flip -f approval=approved -f ref=main"
          echo "  (approve the production environment gate — the only moment the trade is accepted)"
          echo "NOT the undo here: rollback would move traffic back onto the abandoned data."

  # ── rollback (the emergency undo — ungated) ───────────────────────────
  rollback:
    needs: [resolve]
    if: ${{ inputs.action == 'rollback' }}
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate gcloud
        run: |
          set -euo pipefail
          printf '%s\n' "$GOOGLE_SA_KEY" | base64 -d > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json >/dev/null 2>&1
          rm -f /tmp/sa.json
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
      - name: Flip the rules back to the previous owner (or repair a half-flip)
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT || 'houses-498215' }}"
          ZONE="${{ vars.GCP_ZONE || 'us-west1-a' }}"
          REGION="${ZONE%-*}"
          if [ "${{ needs.resolve.outputs.consistent }}" = "true" ]; then
            TARGET="${{ needs.resolve.outputs.owner }}-target"
            MESSAGE="rolled back: houses-l4-* -> $TARGET"
          else
            # Half-flip: the rules point at different boxes. Point both at the one
            # serving HTTPS — that is the leg carrying real traffic, so this is a
            # no-op for users and makes the state consistent again. Moving traffic
            # on a guess is not the undo.
            TARGET="${{ needs.resolve.outputs.target }}"
            MESSAGE="REPAIRED a half-flip: houses-l4-* now agree on $TARGET (the box serving HTTPS). Dispatch rollback again if you also meant to move traffic."
          fi
          for rule in houses-l4-http houses-l4-https; do
            gcloud compute forwarding-rules set-target "$rule" --region "$REGION" --project "$PROJECT" \
              --target-instance "$TARGET" \
              --target-instance-zone "$ZONE"
          done
          echo "$MESSAGE"
          # No DATABASE restore: the rollout never wrote the owner's database, so
          # the previous owner is still serving its own untouched data.
      - name: Verify public health recovered
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            H=$(curl -s -m 10 https://houses.blueumbrella.net/health 2>/dev/null || true)
            S=$(printf '%s' "$H" | python3 -c 'import sys,json; print(json.loads(sys.stdin.read()).get("status",""))' 2>/dev/null || true)
            LW=$(printf '%s' "$H" | python3 -c 'import sys,json; print(json.loads(sys.stdin.read()).get("last_write",""))' 2>/dev/null || true)
            # status/db are the gates. last_write freshness is NOT one: an idle
            # but healthy DAG writes nothing for minutes, and the settle gate
            # reaches the same conclusion — the emergency undo must not report a
            # failure for a rollback that worked.
            if [ "$S" = "ok" ] && [ -n "$LW" ]; then
              echo "rollback verified: status=ok last_write=$LW"
              exit 0
            fi
            sleep 10
          done
          echo "::error::rollback ran but public health did not recover — check action=diagnose"
          exit 1
        timeout-minutes: 10

  # ── rebuild a box from the artifact (replace-not-repair) ──────────────
  provision:
    needs: [resolve, build, image-stale]
    # the chain re-bakes on drift: a bake that ran must have succeeded
    # Part of every rollout (a fresh box per rollout — replace-not-repair), and
    # standalone for a box that needs rebuilding between rollouts.
    if: ${{ always() && needs.resolve.result == 'success' && needs.build.result == 'success' && needs.image-stale.result == 'success' && (inputs.action == 'provision' || github.event_name == 'push' || inputs.action == 'release') }}
    runs-on: ubuntu-latest
    outputs:
      # The rebuilt instance's address is NEW (ephemeral) — everything downstream
      # must use this, not resolve's pre-rebuild reading.
      standby_ip: ${{ steps.wait.outputs.ip }}
    env:
      ARTIFACT: ${{ needs.build.outputs.artifact }}
      REBUILD: ${{ needs.resolve.outputs.standby }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Guard — never rebuild the box that owns the traffic
        run: |
          set -euo pipefail
          if [ "$REBUILD" = "${{ needs.resolve.outputs.owner }}" ]; then
            echo "::error::$REBUILD is the rule's target (it is serving) — refusing to rebuild it"
            exit 1
          fi
          echo "rebuilding the standby $REBUILD from $ARTIFACT"
      - name: Prepare credentials + the operator public key
        run: |
          set -euo pipefail
          printf '%s\n' "$GOOGLE_SA_KEY" | base64 -d > /tmp/sa.json
          chmod 600 /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json >/dev/null 2>&1
          # terraform's GCS backend / google provider reads ADC, not the active
          # gcloud account — keep the key file exported for the rest of the job
          # (first-flight fix 2026-09-29).
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> "$GITHUB_ENV"
          printf '%s\n' "$OPERATOR_PUBKEY" > /tmp/operator.pub
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          OPERATOR_PUBKEY: ${{ secrets.OPERATOR_PUBKEY }}
      - name: terraform apply -replace the standby
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT || 'houses-498215' }}"
          ZONE="${{ vars.GCP_ZONE || 'us-west1-a' }}"
          REGION="${ZONE%-*}"
          KEY=$( [ "$REBUILD" = "houses" ] && echo house || echo standby )
          cd terraform
          terraform init -input=false
          terraform apply -auto-approve -input=false \
            -var "project=$PROJECT" \
            -var "region=$REGION" \
            -var "zone=$ZONE" \
            -var "operator_ssh_public_key_path=/tmp/operator.pub" \
            -var "deploy_pubkey=$DEPLOY_PUBKEY" \
            -var "provision_ref=${{ github.event_name == 'push' && github.ref_name || inputs.ref || 'main' }}" \
            -var "provision_artifact=$ARTIFACT" \
            -var "live_instance=${{ needs.resolve.outputs.owner }}" \
            -replace "google_compute_instance.box[\"$KEY\"]"
        env:
          DEPLOY_PUBKEY: ${{ secrets.DEPLOY_PUBKEY }}
        timeout-minutes: 30
      - id: wait
        name: Wait for the bootstrap (the PROVISIONED marker, via the deploy key)
        run: |
          set -euo pipefail
          printf '%s\n' "$BOX_SSH_KEY" > /tmp/deploy.key
          chmod 600 /tmp/deploy.key
          PROJECT="${{ vars.GCP_PROJECT || 'houses-498215' }}"
          ZONE="${{ vars.GCP_ZONE || 'us-west1-a' }}"
          IP=""
          # 90 min, not 30: a fresh box's bootstrap restores the seed and then
          # migrates it (243k legacy rows measured ~42 min on the box's copy).
          for attempt in $(seq 1 540); do
            [ -n "$IP" ] || IP=$(gcloud compute instances describe "$REBUILD" --zone "$ZONE" --project "$PROJECT" \
              --format='value(networkInterfaces[0].accessConfigs[0].natIP)' 2>/dev/null || true)
            OUT=$(ssh -i /tmp/deploy.key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
              "$BOX_USER@$IP" "sudo /opt/houses/switch.sh --diagnose" 2>/dev/null || true)
            case "$OUT" in
              *provisioned*) echo "ip=$IP" >> "$GITHUB_OUTPUT"; echo "box provisioned after ~$((attempt * 10))s"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::the bootstrap did not complete in 90m — check the GCP console (serial output)"
          exit 1
        env:
          BOX_USER: ${{ secrets.BOX_USER }}
          BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}

  # ── re-bake the base machine image ────────────────────────────────────
  # Monthly-ish, and after any OS or Caddy package change worth landing: the
  # image is the OS half of a fresh box, so a stale one is a stale box. The boxes
  # do not change here — they pick the new image up when they are next rebuilt.
  bake:
    # Run standalone (action=bake) or by the bake image pipeline — NEVER
    # inside a release chain: a builder creation must not sit on the rollout's
    # critical path (2026-09-30: zone capacity blocked two rollouts).
    if: ${{ inputs.action == 'bake' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Authenticate gcloud
        run: |
          set -euo pipefail
          printf '%s\n' "$GOOGLE_SA_KEY" | base64 -d > /tmp/sa.json
          chmod 600 /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json >/dev/null 2>&1
          # terraform's GCS backend / google provider reads ADC, not the active
          # gcloud account — keep the key file exported for the rest of the job
          # (first-flight fix 2026-09-29).
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> "$GITHUB_ENV"
          printf '%s\n' "$OPERATOR_PUBKEY" > /tmp/operator.pub
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          OPERATOR_PUBKEY: ${{ secrets.OPERATOR_PUBKEY }}
      - id: ref
        name: Record the bake source ref (the baked files' shas)
        run: |
          set -euo pipefail
          BAKE_REF=$(bash tools/deploy/bake-ref.sh)
          echo "bake_ref=$BAKE_REF" >> "$GITHUB_OUTPUT"
          echo "bake_ref=$BAKE_REF (the drift check compares every chain against this)"
      - name: terraform apply -replace the builder (the bake runs on first boot)
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT || 'houses-498215' }}"
          ZONE="${{ vars.GCP_ZONE || 'us-west1-a' }}"
          REGION="${ZONE%-*}"
          cd terraform
          terraform init -input=false
          # -target: the bake owns only the builder (created from the STOCK
          # image). On an empty project a full apply would try to create the
          # boxes from houses-base before this very bake has produced it.
          # The builder uses e2-small (not the box's e2-micro): the bake is
          # the one instance creation that must not depend on the free-tier
          # micro capacity of the moment (2026-09-30: us-west1-a refused the
          # builder twice on capacity). Retried with backoff for the same
          # transient-capacity class.
          #
          # Backoff shape (2026-10-02): GCP's pool-exhausted error is INSTANT
          # and continuous for tens of minutes — the fixed 3×120s loop (≈5 min
          # horizon) sat inside a run-long outage: six immediate rejections
          # across two runs and it never had a chance. Exponential backoff
          # instead: 120s → 240s → 480s → 960s → 1500s, a ~55-minute horizon
          # inside the step's 90-minute cap (raised from 65 on a PR-review
          # finding, 2026-10-02: the sleeps alone total ~55 min and the final
          # successful apply after an outage is slower than usual, so 65 was
          # thin enough to kill the step mid-backoff). Still ONLY retried for
          # the capacity class — any other error fails immediately. ONE retry
          # mechanism, deliberately no dispatch-level retry on top.
          ok=0
          attempt=0
          BACKOFF=120
          while [ "$attempt" -lt 6 ]; do
            attempt=$((attempt + 1))
            if OUT=$(terraform apply -auto-approve -input=false \
              -var "project=$PROJECT" \
              -var "region=$REGION" \
              -var "zone=$ZONE" \
              -var "machine_type=e2-small" \
              -var "operator_ssh_public_key_path=/tmp/operator.pub" \
              -var "deploy_pubkey=$DEPLOY_PUBKEY" \
              -var "provision_ref=${{ github.event_name == 'push' && github.ref_name || inputs.ref || 'main' }}" \
              -target=google_compute_instance.base_builder \
              -replace=google_compute_instance.base_builder 2>&1); then
              ok=1
              break
            fi
            if ! printf '%s\n' "$OUT" | grep -qE "does not have enough resources|capacity"; then
              printf '%s\n' "$OUT"
              echo "::error::bake apply failed with a NON-capacity error — not retrying"
              exit 1
            fi
            [ "$attempt" -lt 6 ] || break
            echo "bake apply attempt $attempt failed on zone capacity — retrying in ${BACKOFF}s"
            sleep "$BACKOFF"
            BACKOFF=$((BACKOFF * 2))
            [ "$BACKOFF" -gt 1500 ] && BACKOFF=1500
          done
          # the loop exit status is the LAST body command's (sleep = 0) — never
          # rely on set -e: the explicit flag is the truth after retries
          [ "$ok" = 1 ] || { echo "::error::bake apply failed after 6 tries (capacity)"; exit 1; }
        env:
          DEPLOY_PUBKEY: ${{ secrets.DEPLOY_PUBKEY }}
        timeout-minutes: 90
      - name: Wait for the bake to FINISH (the bake script powers the box off when done)
        run: |
          set -euo pipefail
          # The completion signal IS the powered-off state: terraform cannot see a
          # startup script's progress, and stopping the box on creation would cut
          # the bake short mid-apt. An image taken from a box that is still
          # baking would be a silently truncated OS layer.
          PROJECT="${{ vars.GCP_PROJECT || 'houses-498215' }}"
          ZONE="${{ vars.GCP_ZONE || 'us-west1-a' }}"
          for attempt in $(seq 1 90); do
            STATUS=$(gcloud compute instances describe houses-base-builder --zone "$ZONE" --project "$PROJECT" --format='value(status)' 2>/dev/null || true)
            case "$STATUS" in
              TERMINATED|STOPPED) echo "bake finished: status=$STATUS after ~$((attempt * 20))s"; exit 0 ;;
            esac
            echo "bake still running (status=$STATUS, attempt $attempt/90)"
            sleep 20
          done
          echo "::error::the bake did not finish in 30m — check the builder's serial output; NO image was created"
          exit 1
        timeout-minutes: 35
      - name: Create the base image from the baked disk
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT || 'houses-498215' }}"
          ZONE="${{ vars.GCP_ZONE || 'us-west1-a' }}"
          # The boxes reference the image BY NAME, so recreating it is how a
          # re-bake reaches them (at their NEXT rebuild — never in place).
          echo "NOTE: do not bake while a rollout is creating a box — for a few seconds the name has no image behind it."
          gcloud compute images delete "${{ vars.GCP_BASE_IMAGE || 'houses-base' }}" --project "$PROJECT" --quiet 2>/dev/null || true
          gcloud compute images create "${{ vars.GCP_BASE_IMAGE || 'houses-base' }}" \
            --project "$PROJECT" \
            --source-disk=houses-base-builder --source-disk-zone="$ZONE" \
            --description="Baked OS layer for the houses boxes (packages + Caddy + layout). bake_ref=${{ steps.ref.outputs.bake_ref }}"
          gcloud compute images describe "${{ vars.GCP_BASE_IMAGE || 'houses-base' }}" --project "$PROJECT" \
            --format='value(name,status,diskSizeGb)'
          echo "base image ready: boxes built from now on use it"
        timeout-minutes: 20

  # ── the one-time greenfield scaffold ──────────────────────────────────
  # The workflow's resolve step needs both boxes, both target instances and
  # both rules to exist before ANY rollout action can run; nothing in the
  # workflow creates them. This action is that creation — once. Guarded to
  # refuse once the plane exists (use action=release from then on), and loud
  # if houses-base is missing (action=bake must run first).
  scaffold:
    if: ${{ inputs.action == 'scaffold' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Authenticate gcloud
        run: |
          set -euo pipefail
          printf '%s\n' "$GOOGLE_SA_KEY" | base64 -d > /tmp/sa.json
          chmod 600 /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json >/dev/null 2>&1
          # terraform's GCS backend / google provider reads ADC, not the active
          # gcloud account — keep the key file exported for the rest of the job
          # (first-flight fix 2026-09-29).
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> "$GITHUB_ENV"
          printf '%s\n' "$OPERATOR_PUBKEY" > /tmp/operator.pub
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          OPERATOR_PUBKEY: ${{ secrets.OPERATOR_PUBKEY }}
      - name: Guard — refuses when the plane already exists
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT || 'houses-498215' }}"
          ZONE="${{ vars.GCP_ZONE || 'us-west1-a' }}"
          REGION="${ZONE%-*}"
          if gcloud compute forwarding-rules describe houses-l4-https --region "$REGION" --project "$PROJECT" >/dev/null 2>&1; then
            echo "::error::the L4 rules already exist — this is not a greenfield scaffold; use action=release"
            exit 1
          fi
          echo "scaffolding the two-instance data plane"
      - name: terraform apply — the two boxes + target instances + rules
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT || 'houses-498215' }}"
          ZONE="${{ vars.GCP_ZONE || 'us-west1-a' }}"
          REGION="${ZONE%-*}"
          cd terraform
          terraform init -input=false
          # base_image defaults to houses-base: boxes boot FROM the baked
          # image. A missing image fails this apply loudly (bake first).
          terraform apply -auto-approve -input=false \
            -var "project=$PROJECT" \
            -var "region=$REGION" \
            -var "zone=$ZONE" \
            -var "operator_ssh_public_key_path=/tmp/operator.pub" \
            -var "deploy_pubkey=$DEPLOY_PUBKEY" \
            -var "provision_ref=${{ github.event_name == 'push' && github.ref_name || inputs.ref || 'main' }}" \
            -var "provision_artifact=${{ inputs.artifact }}"
          terraform output
        env:
          DEPLOY_PUBKEY: ${{ secrets.DEPLOY_PUBKEY }}
        timeout-minutes: 30
      - name: Notes
        run: |
          echo "boxes bootstrapping from houses-base: watch with action=diagnose"
          echo "next: gh workflow run Release -f action=release; then cutover/recover"

  # ── read-only state dump ──────────────────────────────────────────────
  diagnose:
    needs: [resolve]
    if: ${{ always() && inputs.action == 'diagnose' && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dump both boxes
        run: |
          set +e
          printf '%s\n' "$BOX_SSH_KEY" > /tmp/deploy.key
          chmod 600 /tmp/deploy.key
          for box in "owner:${{ needs.resolve.outputs.owner_ip }}" "standby:${{ needs.resolve.outputs.standby_ip }}"; do
            NAME=${box%%:*}; IP=${box#*:}
            echo "############ $NAME ($IP) ############"
            ssh -i /tmp/deploy.key -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
              "$BOX_USER@$IP" "sudo /opt/houses/switch.sh --diagnose"
            echo "############ end $NAME ############"
          done
        env:
          BOX_USER: ${{ secrets.BOX_USER }}
          BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
        timeout-minutes: 15
