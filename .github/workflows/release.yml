name: Release

# Blue/green release, driven from GitHub.
#
#   deploy  — checkout the ref on the STANDBY box side, snapshot the live DB
#             into the standby's smoke copy, start it, run authenticated
#             smoke checks. The live side and live DB are untouched. The
#             standby is then publicly reachable at the smoke hostname
#             (https://houses-smoke.blueumbrella.net) for human eyeballing.
#   switch  — flip: stop the live side, start the (smoke-verified) standby on
#             the live DB (Caddy's config is static — nothing else changes).
#             Run this AFTER the standby has been smoke-tested.
#   rollback — undo the last switch (previous code + pre-flip DB snapshot).
#
# Triggers: push a tag v* (deploys automatically) or workflow_dispatch with
# the action of your choice.
#
# Ref guard: a tag push is accepted only when the tag is reachable from
# main — the released code must have gone through a PR (see
# docs/deploy-discipline.md).  A non-main ref is released only via an
# explicit workflow_dispatch with the ref input named: the deliberate,
# reviewable bypass, never a tag.
#
# Requires GitHub secrets: BOX_HOST (public IP or hostname), BOX_USER,
# BOX_SSH_KEY (private key of the restricted deploy key; see
# tools/deploy/provision.md).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'git ref to release (SHA, branch, or tag)'
        required: false
        default: 'main'
      action:
        description: 'deploy to standby | switch over | rollback'
        required: false
        default: 'deploy'
        type: choice
        options: ['deploy', 'switch', 'rollback']

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Guard — released ref must be on main (tags) or explicitly dispatched
        env:
          REF: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
        run: |
          set -euo pipefail
          # The ref is interpolated into a remote shell command below —
          # refuse anything outside the safe charset so a tag or dispatch
          # input cannot break out of the quoting (PR #68 review,
          # command injection).
          case "$REF" in
            *[!A-Za-z0-9._/-]*)
              echo "ERROR: ref '$REF' contains characters outside [A-Za-z0-9._/-] — refusing to deploy." >&2
              exit 1
              ;;
          esac
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push: the tag must be reachable from main — the code
            # went through a PR.  Tagging a feature branch directly is an
            # unreviewed deploy; fail it (see docs/deploy-discipline.md).
            echo "Tag push — verifying $REF is reachable from main..."
            git init -q .
            git remote add origin "https://github.com/${{ github.repository }}.git"
            git fetch -q --filter=blob:none origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/tags/$REF:refs/tags/$REF"
            if ! git merge-base --is-ancestor "$REF" origin/main; then
              echo "ERROR: tag $REF is not reachable from main. Merge the PR first, then re-tag main." >&2
              exit 1
            fi
          else
            echo "workflow_dispatch with ref=$REF"
            if [ "$REF" != "main" ]; then
              echo "NOTE: releasing non-main ref $REF — the deliberate, reviewable bypass."
            fi
          fi

      - name: Deploy ref to standby and smoke-test it
        env:
          BOX_HOST: ${{ secrets.BOX_HOST }}
          BOX_USER: ${{ secrets.BOX_USER }}
          BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
        run: |
          set -euo pipefail
          REF="${{ github.event_name == 'push' && github.ref_name || inputs.ref }}"
          echo "Deploying $REF to the standby..."
          printf '%s\n' "$BOX_SSH_KEY" > /tmp/deploy.key
          chmod 600 /tmp/deploy.key
          ssh -i /tmp/deploy.key -o StrictHostKeyChecking=accept-new \
            "$BOX_USER@$BOX_HOST" "sudo /opt/houses/release.sh '$REF'"
        timeout-minutes: 40

  switch:
    if: inputs.action == 'switch'
    runs-on: ubuntu-latest
    steps:
      - name: Switch traffic to the smoke-verified standby
        env:
          BOX_HOST: ${{ secrets.BOX_HOST }}
          BOX_USER: ${{ secrets.BOX_USER }}
          BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BOX_SSH_KEY" > /tmp/deploy.key
          chmod 600 /tmp/deploy.key
          ssh -i /tmp/deploy.key -o StrictHostKeyChecking=accept-new \
            "$BOX_USER@$BOX_HOST" "sudo /opt/houses/switch.sh"
        timeout-minutes: 20

  rollback:
    if: inputs.action == 'rollback'
    runs-on: ubuntu-latest
    steps:
      - name: Roll back to the previous side
        env:
          BOX_HOST: ${{ secrets.BOX_HOST }}
          BOX_USER: ${{ secrets.BOX_USER }}
          BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BOX_SSH_KEY" > /tmp/deploy.key
          chmod 600 /tmp/deploy.key
          ssh -i /tmp/deploy.key -o StrictHostKeyChecking=accept-new \
            "$BOX_USER@$BOX_HOST" "sudo /opt/houses/switch.sh --rollback"
        timeout-minutes: 20
