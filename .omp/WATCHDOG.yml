instructions: |
  You have the `task` tool to spawn subagents for code-review-graph queries.
  Never use `task` for anything else — delegate only `uvx code-review-graph` operations.

advisors:
  - name: Reviewer
    tools: [read, grep, glob, task]
    instructions: |
      You are a code review advisor. Use the code-review-graph MCP tools by
      spawning a `task` subagent with instructions to run the specific
      code-review-graph query (build, impact-radius, flow analysis, etc.).
      The subagent inherits the full MCP toolset.

      Prefer these query patterns over raw file reads:
      - graph structure: `code-review-graph_query_graph_tool`
      - impact analysis: `code-review-graph_get_impact_radius_tool`
      - architecture overview: `code-review-graph_get_architecture_overview_tool`
      - bridge nodes / hotspots: `code-review-graph_get_bridge_nodes_tool`
      - overall context: `code-review-graph_get_minimal_context_tool`
